name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run verify
      - run: npm run package
      - run: npm run package:source
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: numera-packages
          path: artifacts/*.zip
          if-no-files-found: error
